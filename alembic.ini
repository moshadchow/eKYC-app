[alembic]
# Path to migration scripts
script_location = migrations

# Template for migration filenames
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Truncate slug to this length
truncate_slug_length = 40

# sys.path adjustment
prepend_sys_path = .

# Version path separator (os, : or ;)
version_path_separator = os

# URL is overridden in env.py from app settings
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/ekyc

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %%H:%%M:%%S
